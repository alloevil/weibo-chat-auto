# Monthly version updates. Minor/patch bumps are grouped into one PR per ecosystem;
# major bumps get their own PR so a red CI points at a single dependency.
# Security updates are handled separately by GitHub's alert flow.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      githubactions-all:
        patterns: ["*"]
    commit-message:
      prefix: chore
