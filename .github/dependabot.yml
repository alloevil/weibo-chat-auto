# Monthly, grouped version updates: at most one PR per ecosystem per month.
# Security updates are handled separately by GitHub's alert flow.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-all:
        patterns: ["*"]
    commit-message:
      prefix: chore
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo-all:
        patterns: ["*"]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      githubactions-all:
        patterns: ["*"]
    commit-message:
      prefix: chore
