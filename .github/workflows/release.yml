name: Release Desktop App

# 打 v* tag 时自动构建 macOS 桌面应用并附到对应 GitHub Release。
on:
    push:
        tags: ['v*']

permissions:
    contents: write

jobs:
    build-macos:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v7

            # tag 与三处版本号必须一致，否则 ship 出去的应用版本号还是旧的，
            # 应用内更新检查（lib/version-check.js）也随之失效
            - name: Verify tag matches version files
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  pkg="$(node -p "require('./package.json').version")"
                  tauri="$(node -p "require('./src-tauri/tauri.conf.json').version")"
                  cargo="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
                  echo "tag=$tag package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
                  test "$tag" = "$pkg" && test "$tag" = "$tauri" && test "$tag" = "$cargo" || {
                    echo "::error::tag 与 package.json / tauri.conf.json / Cargo.toml 版本不一致，请先同步版本号再打 tag"
                    exit 1
                  }

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Build app (tauri build)
              # 只要 .app：dmg 打包在无头环境易失败，直接不请求它（--bundles app）。
              # 旧写法 `tauri build || test -d .app` 会把真实构建失败掩盖成成功
              #（残留的半成品 .app 也会让 test -d 通过）
              run: npx tauri build --bundles app

            - name: Zip .app
              run: |
                  cd src-tauri/target/release/bundle/macos
                  ditto -c -k --keepParent "微博群聊.app" "weibo-chat_${GITHUB_REF_NAME}_aarch64.app.zip"

            - name: Upload to release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # gh release upload 不会自建 Release：只有 tag 没有 Release 时
                  # 直接失败。先确保存在（沿用 tag 的自动 notes）
                  gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
                    gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
                  gh release upload "$GITHUB_REF_NAME" \
                    "src-tauri/target/release/bundle/macos/weibo-chat_${GITHUB_REF_NAME}_aarch64.app.zip" \
                    --clobber

            - name: Append install instructions to release body
              # 「下载 .app」是首选安装路径(#17)：每个 release 末尾统一追加安装说明
              # (Gatekeeper 右键打开 + 仅 Apple Silicon)。已有该段落则跳过,不覆盖手写正文。
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  body="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
                  if printf '%s' "$body" | grep -q '## 📦 安装'; then
                    echo "Install section already present, skipping."
                    exit 0
                  fi
                  printf '%s\n\n## 📦 安装\n\n1. 下载下方 `weibo-chat_%s_aarch64.app.zip` 并解压。\n2. 应用未签名，首次打开请**右键 .app → 打开 → 打开**（绕过 Gatekeeper，只需一次）。\n3. 点击 🔑 登录扫码即可使用。\n\n> ⚠️ 仅支持 Apple Silicon (M1/M2/M3/M4)。其他平台请用[网页版](https://github.com/alloevil/weibo-chat-auto#-quick-start)。\n' "$body" "$GITHUB_REF_NAME" > /tmp/release-body.md
                  gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-body.md
