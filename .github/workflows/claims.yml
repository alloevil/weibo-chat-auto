name: claims

# Runs the receipts behind claims.json: every published number must still be printed by the
# command next to it. Weekly as well as on push, because data moves without anyone committing.
on:
    push:
    pull_request:
    schedule:
        - cron: '17 6 * * 1'

permissions:
    contents: read

jobs:
    verify:
        name: published numbers still reproduce
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4  # 与 ci.yml 同一个理由：tests-green 的收据真的去跑 npm test，而 test/qa-tools.test.mjs
            # 会 import scripts/qa-agent.mjs → @earendil-works/pi-agent-core。裸 checkout 里这行 import
            # 失败，无法复现 claims.json 声称的完整通过数量。所以先装依赖。
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - uses: alloevil/verify-claims@v0.1.1
