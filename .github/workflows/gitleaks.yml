name: Gitleaks

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: gitleaks-${{ github.ref }}
    cancel-in-progress: true

# 密钥扫描：历史提交 + 当前树都要扫。personal public repo 用 gitleaks-action
# 免费；组织仓库需要 Gitleaks 许可证（见 action README）。
permissions:
    contents: read

jobs:
    scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # 浅克隆只拿到一个 commit，旧提交里的密钥会漏扫
                  fetch-depth: 0

            - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
