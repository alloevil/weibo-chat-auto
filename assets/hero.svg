<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">
  <title id="title">Weibo Group Chat Archiver</title>
  <desc id="desc">A dark-themed hero showing Weibo chat messages being archived through a Tauri desktop app into a local viewer with AI-powered features.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC131"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
  </defs>

  <!-- Background — matches Linear dark theme -->
  <rect width="1200" height="340" rx="0" fill="#0d0d0d"/>

  <!-- Subtle grid -->
  <g opacity="0.03">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="300" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Left: Title block -->
  <g id="title-block" transform="translate(64 44)">
    <!-- Category eyebrow -->
    <text x="0" y="0" fill="#6b6b6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" letter-spacing="2">
      DESKTOP APP · SELF-HOSTED · OPEN SOURCE
    </text>

    <!-- Project name -->
    <text x="0" y="48" fill="#f5f5f5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="42" font-weight="700">
      Weibo Chat Archiver
    </text>

    <!-- Concrete description -->
    <text x="0" y="82" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="400">
      Archive Weibo group chats · Native desktop app · AI summaries
    </text>

    <!-- Tech pills -->
    <g transform="translate(0 110)">
      <rect x="0" y="0" width="80" height="26" rx="13" fill="none" stroke="#333" stroke-width="1"/>
      <text x="40" y="17" fill="#FFC131" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" font-weight="600">Tauri 2</text>

      <rect x="88" y="0" width="100" height="26" rx="13" fill="none" stroke="#333" stroke-width="1"/>
      <text x="138" y="17" fill="#40B5A4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" font-weight="600">Puppeteer</text>

      <rect x="196" y="0" width="70" height="26" rx="13" fill="none" stroke="#333" stroke-width="1"/>
      <text x="231" y="17" fill="#339933" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" font-weight="600">Node 18+</text>

      <rect x="274" y="0" width="90" height="26" rx="13" fill="none" stroke="#333" stroke-width="1"/>
      <text x="319" y="17" fill="#6b6b6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">macOS|Linux</text>
    </g>

    <!-- Feature highlights -->
    <g transform="translate(0 156)">
      <text x="0" y="0" fill="#6b6b6b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13">
        <tspan fill="#f5f5f5">Multi-group</tspan> · Incremental archive · <tspan fill="#f5f5f5">AI Q&amp;A</tspan> · Heatmap · <tspan fill="#f5f5f5">Context panel</tspan>
      </text>
    </g>
  </g>

  <!-- Right: Architecture diagram -->
  <g id="architecture" transform="translate(640 30)">
    <!-- Weibo source -->
    <g transform="translate(0 20)">
      <rect x="0" y="0" width="120" height="44" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
      <text x="60" y="18" fill="#FFC131" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📱 Weibo</text>
      <text x="60" y="34" fill="#6b6b6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">Group Chat API</text>
    </g>

    <!-- Arrow -->
    <path d="M120 42 L170 42" stroke="#FFC131" stroke-opacity="0.4" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Archiver -->
    <g transform="translate(170 10)">
      <rect x="0" y="0" width="140" height="64" rx="8" fill="#1a1a1a" stroke="#FFC131" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="70" y="22" fill="#FFC131" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Archiver</text>
      <text x="70" y="38" fill="#6b6b6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">Puppeteer · Cookie</text>
      <text x="70" y="52" fill="#6b6b6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">Incremental · JSON</text>
    </g>

    <!-- Arrow -->
    <path d="M310 42 L360 42" stroke="#FFC131" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>

    <!-- Local Storage -->
    <g transform="translate(360 20)">
      <rect x="0" y="0" width="120" height="44" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
      <text x="60" y="18" fill="#f5f5f5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">💾 Local</text>
      <text x="60" y="34" fill="#6b6b6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">output/群名/*.json</text>
    </g>

    <!-- Arrow down -->
    <path d="M420 64 L420 96" stroke="#FFC131" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>

    <!-- Viewer -->
    <g transform="translate(280 96)">
      <rect x="0" y="0" width="280" height="90" rx="10" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
      <text x="140" y="22" fill="#f5f5f5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🖥 Viewer</text>

      <!-- Feature grid -->
      <g transform="translate(16 32)">
        <text x="0" y="0" fill="#a0a0a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Heatmap</text>
        <text x="70" y="0" fill="#a0a0a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Context</text>
        <text x="130" y="0" fill="#a0a0a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Search</text>
        <text x="190" y="0" fill="#a0a0a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Stats</text>

        <text x="0" y="18" fill="#a0a0a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Multi-group</text>
        <text x="80" y="18" fill="#a0a0a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Filter</text>
        <text x="130" y="18" fill="#a0a0a0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Export</text>
      </g>

      <!-- AI badge -->
      <g transform="translate(16 60)">
        <rect x="0" y="0" width="248" height="22" rx="11" fill="#FFC131" fill-opacity="0.1" stroke="#FFC131" stroke-opacity="0.3" stroke-width="1"/>
        <text x="124" y="15" fill="#FFC131" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle" font-weight="600">🤖 AI Daily Summary · Agentic Q&amp;A</text>
      </g>
    </g>

    <!-- Tauri badge -->
    <g transform="translate(280 200)">
      <rect x="0" y="0" width="280" height="28" rx="6" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
      <text x="140" y="18" fill="#6b6b6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">Tauri v2 native window · Bun sidecar · WKWebView login</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="64" y="325" width="160" height="3" rx="1.5" fill="url(#accent)" opacity="0.5"/>
</svg>
