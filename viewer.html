                    <span class="user-actbar"><span class="user-actbar-fill" style="width:${pct}%"></span></span>
                </div>
            </div>
        </div>`;
    }).join('');
}

// 渲染消息
function renderMessages(msgs) {
    const el = document.getElementById('messages');
    if (msgs.length === 0) {
        el.innerHTML = '<div class="empty">没有消息</div>';
        return;
    }
    // 构建内容索引（供引用跳转 + 显示原作者：规范化前缀 → {id, user}）
    // 用当天全量消息构建，与筛选解耦——否则被筛掉的原消息会导致引用解析不出作者
    window.__contentIndex = {};
    const indexSource = (typeof allMessages !== 'undefined' && allMessages.length)
        ? allMessages.filter(m => m.date === selectedDate)
        : msgs;
    for (const m of indexSource) {
        if (m.content && m.id != null) {
            const key = normForQuote(m.content);
            if (key && !(key in window.__contentIndex)) window.__contentIndex[key] = { id: m.id, user: m.user };
        }
    }

    let lastSeg = null;          // 上一条所属时段
    let unreadInserted = false;  // 未读分隔线只插一次
    const pieces = [];

    msgs.forEach((m, index) => {
        const prev = msgs[index - 1];
        const prevTime = prev ? Number(prev.timestamp) : 0;
        const currentTime = Number(m.timestamp);

        // 时段分隔锚点
        let brokeFlow = false;
        const seg = periodOf(currentTime);
        if (!lastSeg || seg.key !== lastSeg) {
            pieces.push(`<div class="time-divider"><span>${seg.label}</span></div>`);
            lastSeg = seg.key;
            brokeFlow = true;
        }
        // 未读分隔线（首条新消息前，且非整列表第一条）
        if (!unreadInserted && index > 0 && lastVisitTimestamp > 0 && currentTime > lastVisitTimestamp) {
            pieces.push(`<div class="unread-divider">以下为新消息</div>`);
            unreadInserted = true;
            brokeFlow = true;
        }

        const sameUser = !brokeFlow && prev && prev.user === m.user && currentTime - prevTime <= 5 * 60 * 1000;
        const time = m.time.split(' ')[1] || '';
        const accent = getUserAccent(m.user);
        const continuation = sameUser ? ' msg-item-continuation' : '';
        let content = processForward(m.content);
        if (searchQuery) {
            content = highlightText(content, escapeHtml(searchQuery));
        }
        // 附件：图片和文件
        let attach = '';
        if (m.pics && m.pics.length > 0) {
            // 检查是否是文件消息（内容是文件名）
            const fileExt = m.content && /\.(pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar|txt|csv|rtf|odt|ods|odp)$/i.test(m.content);
            if (fileExt && m.pics.length === 1) {
                // 文件消息：显示文件卡片
                const fileUrl = m.pics[0];
                const fileName = escapeHtml(m.content);
                const icon = getFileIcon(m.content);
                attach += `<div class="msg-file">
                    <span class="msg-file-icon">${icon}</span>
                    <div class="msg-file-info">
                        <div class="msg-file-name">${fileName}</div>
                        <a class="msg-file-download" href="${fileUrl}" download="${fileName}">Download</a>
                    </div>
                </div>`;
            } else {
                // 普通图片消息
                attach += '<div class="msg-pics">' + m.pics.map(u => `<img src="${u}" loading="lazy" onclick="openLightbox('${u}')">`).join('') + '</div>';
            }
        }
        // 附件：分享的帖子（转发引用场景跳过，避免与引用块重复）
        if (m.share && !(m.content || '').includes(' - - - - - - - - - - - - - - - ')) {
            const s = m.share;
            const title = escapeHtml(s.title || s.url || '');
            const author = s.author ? `<div class="share-author">${escapeHtml(s.author)}</div>` : '';
            const text = (s.text && s.text !== s.title) ? `<div class="share-text">${processEmoji(escapeHtml(s.text))}</div>` : '';
            const desc = s.description ? `<div class="share-desc">${escapeHtml(s.description)}</div>` : '';
            const picsHtml = s.pics && s.pics.length > 0 ? '<div class="msg-pics">' + s.pics.map(u => `<img src="${u}" loading="lazy" onclick="openLightbox('${u}')">`).join('') + '</div>' : '';
            const stats = (s.reposts || s.comments || s.likes) ? `<div class="share-stats">${s.reposts ? '转发 ' + s.reposts : ''} ${s.comments ? '评论 ' + s.comments : ''} ${s.likes ? '赞 ' + s.likes : ''}</div>` : '';
            const link = s.url ? `<a class="share-link" href="${s.url}" target="_blank" rel="noopener">${escapeHtml(s.url)}</a>` : '';
            attach += `<div class="share-card">${author}${title ? '<div class="share-title">' + title + '</div>' : ''}${text}${desc}${picsHtml}${stats}${link}</div>`;
        }
        // 附件：视频链接（已有分享卡片时跳过，避免重复）
        if (m.videoUrl && !m.share) {
            attach += `<div class="msg-video"><a href="${m.videoUrl}" target="_blank" rel="noopener" class="msg-link">▶ Watch Video</a></div>`;
        }
        // 附件：普通链接
        if (m.link && !m.share) {
            attach += `<div class="msg-link-attach"><a href="${m.link}" target="_blank" rel="noopener" class="msg-link">${escapeHtml(m.link)}</a></div>`;
        }
        // 分享内容与正文重复时，用简短指示替代正文（保留格式结构）
        if (m.share && m.content && !m.content.includes(' - - - - - - - - - - - - - - - ')) {
            const s = m.share;
            const raw = (m.content || '').replace(/[\s​]+/g, '');
            const title = (s.title || '').replace(/[\s​]+/g, '');
            if (title.length >= 8 && raw.includes(title.substring(0, Math.min(20, title.length)))) {
                const link = s.url ? `<a class="msg-link" href="${s.url}" target="_blank">${escapeHtml(s.url)}</a>` : '';
                content = `<span style="color:var(--ink-subtle);font-size:13px">↗ ${escapeHtml((s.author || '') + ' ' + title.substring(0, 25))}${title.length > 25 ? '...' : ''}</span> ${link}`;
            }
        }
        const userInitial = escapeHtml(m.user.charAt(0));
        const avatarHtml = m.avatar ? `<img class="msg-av" src="${avatarSrc(m.avatar)}" loading="lazy" onerror="this.remove()">` : '';
        const userAttr = m.avatar ? `data-hasavatar data-initial="${userInitial}"` : `data-initial="${userInitial}"`;
        const userName = searchQuery ? highlightText(escapeHtml(m.user), escapeHtml(searchQuery)) : escapeHtml(m.user);
        const isNew = lastVisitTimestamp > 0 && m.timestamp > lastVisitTimestamp;
        const newBadge = isNew ? '<span class="msg-new">NEW</span>' : '';
        const avatarEl = m.avatar
            ? `<div class="msg-avatar"><img src="${avatarSrc(m.avatar)}" onerror="this.parentElement.textContent='${userInitial}'"></div>`
            : `<div class="msg-avatar">${userInitial}</div>`;
        const contAvatar = continuation
            ? (m.avatar ? `<img class="cont-avatar" src="${avatarSrc(m.avatar)}" onerror="this.remove()">` : `<span class="cont-avatar">${userInitial}</span>`)
            : '';
        pieces.push(`<div class="msg-item${continuation}" id="msg-${m.id}" data-hour="${new Date(m.timestamp).getHours()}" style="--user-accent:${accent}">
            ${continuation ? contAvatar : avatarEl}
            <div class="msg-header">
                <span class="msg-user">${userName}${newBadge}</span>
                <span class="msg-time">${time}</span>
                <span class="msg-ctx-link" onclick="openContext('${m.id}')" title="查看这条消息的上下文">🎯 上下文</span>
            </div>
            <div class="msg-body">
                <div class="msg-content">${content}</div>
                ${attach ? '<div class="msg-attach">' + attach + '</div>' : ''}
            </div>
            ${continuation ? `<span class="msg-ctx-btn" onclick="openContext('${m.id}')">🎯 上下文</span>` : ''}
        </div>`);
    });
    el.innerHTML = pieces.join('');
}


function renderAll() {
    const filtered = getFiltered();
    renderUserList();
    renderMessages(filtered);
    renderMediaBar();

    // 用户筛选后滚动到顶部（时段筛选由 toggleHour 处理；搜索由下方定位处理）
    if (selectedUsers.size > 0 && !searchQuery) {
        const msgEl = document.getElementById('messages');
        if (msgEl) msgEl.scrollTop = 0;
    }

    const users = new Set(filtered.map(m => m.user));
    const newCount = filtered.filter(m => m.timestamp > lastVisitTimestamp).length;
    const newInfo = newCount > 0 ? ` · <span style="color:var(--primary-hover)">${newCount} 条新消息</span>` : '';
    document.getElementById('stats').innerHTML = `${filtered.length} 条 · ${users.size} 人${newInfo}`;
    updateDateToggle();

    // 搜索：不过滤，改为高亮 + 定位到第一处匹配
    if (searchQuery) {
        const hits = document.querySelectorAll('.search-highlight');
        document.getElementById('searchNav').className = 'search-nav' + (hits.length ? ' show' : '');
        if (hits.length) {
            searchNavIndex = -1;
            navigateSearch(1); // 跳到第一处并更新计数
        } else {
            document.getElementById('searchCountText').textContent = '无匹配';
        }
    } else {
        document.getElementById('searchCountText').textContent = '';
        document.getElementById('searchNav').className = 'search-nav';
    }

    const bar = document.getElementById('filterBar');
    const parts = [];
    if (searchQuery) {
        parts.push('搜索「' + searchQuery + '」');
    }
    if (selectedHours.size > 0) {
        parts.push('时段 ' + [...selectedHours].sort((a, b) => a - b).map(h => String(h).padStart(2, '0') + ':00').join('、'));
    }
    if (selectedUsers.size > 0) {
        parts.push('成员 ' + [...selectedUsers].join('、'));
    }
    const mediaLabels = { pics: '图片', video: '视频', link: '链接' };
    if (mediaFilter !== 'all') {
        parts.push('类型 ' + (mediaLabels[mediaFilter] || mediaFilter));
    }
    // 噪声计数移进筛选面板：Hide Noise 默认开启，把它常驻成顶部横幅等于
    // 每次打开都先看到一行"Hidden noise: N·Export"，纯属干扰阅读。
    const noiseCount = hideNoise ? allMessages.filter(m => {
        if (m.date !== selectedDate) return false;
        if (selectedHours.size > 0 && !selectedHours.has(new Date(m.timestamp).getHours())) return false;
        if (selectedUsers.size > 0 && !selectedUsers.has(m.user)) return false;
        return isNoise(m);
    }).length : 0;
    document.getElementById('noiseCount').textContent = hideNoise
        ? (noiseCount ? `已隐藏 ${noiseCount} 条噪声` : '无噪声消息')
        : '噪声消息显示中';

    // 状态行只解释"主动筛掉内容"的操作（默认的噪声过滤不算），
    // 这样默认状态下消息区上方是干净的。
    // 这行是筛选生效时的唯一解释，顺手给出"清除"与"导出"两个动作 ——
    // 只显示状态不给出路，用户还得自己回筛选面板一个个取消。
    bar.innerHTML = parts.length
        ? `<span class="filter-summary">已筛选：${parts.join(' · ')}</span>`
            + '<span class="filter-export" onclick="clearAllFilters()">清除</span>'
            + '<span class="filter-export" onclick="exportMessages()">导出</span>'
        : '';
    bar.className = 'filter-bar' + (parts.length ? ' show' : '');
    updateToolsIndicator(parts.length > 0);

    if (statsView) renderStats();
}

// Statistics Panel
function toggleStats() {
    statsView = !statsView;
    document.getElementById('statsToggle').classList.toggle('active', statsView);
    const msgEl = document.getElementById('messages');
    const statsEl = document.getElementById('statsPanel');
    // hours 与类型筛选现在都在筛选面板里，整块一起隐藏即可
    const toolsEl = document.getElementById('toolsPanel');
    const searchEl = document.getElementById('navSearch');   // 搜索/提问已上移到导航行
    const filterEl = document.getElementById('filterBar');

    if (statsView) {
        msgEl.style.display = 'none';
        toolsEl.style.display = 'none';
        searchEl.style.display = 'none';
        filterEl.style.display = 'none';
        statsEl.classList.add('show');
        renderStats();
    } else {
        msgEl.style.display = '';
        toolsEl.style.display = '';   // 恢复由 .show 类决定是否展开
        searchEl.style.display = '';
        filterEl.style.display = '';
        statsEl.classList.remove('show');
    }
    updateComposer();   // 统计视图下隐藏输入框
}

// 筛选面板开关。默认折叠；状态存 localStorage，跨会话保持。
function toggleTools() {
    const panel = document.getElementById('toolsPanel');
    const open = !panel.classList.contains('show');
    panel.classList.toggle('show', open);
    document.getElementById('toolsToggle').classList.toggle('open', open);
    try { open ? localStorage.setItem('viewer-tools-open', '1') : localStorage.removeItem('viewer-tools-open'); } catch { /* 隐私模式 */ }
    if (open) renderHours();   // 折叠期间可能换过日期，展开时重画
}

/** 面板折叠时用小圆点提示"仍有筛选生效"，否则会以为消息莫名变少了。 */
function updateToolsIndicator(hasActiveFilter) {
    document.getElementById('toolsToggle').classList.toggle('filtered', !!hasActiveFilter);
}

function restoreToolsState() {
    let open = false;
    try { open = localStorage.getItem('viewer-tools-open') === '1'; } catch { /* 隐私模式 */ }
    if (!open) return;
    document.getElementById('toolsPanel').classList.add('show');
    document.getElementById('toolsToggle').classList.add('open');
}
restoreToolsState();

function renderStats() {
    const filtered = getFiltered();
    const allFiltered = allMessages.filter(m => {
        if (selectedHours.size > 0 && !selectedHours.has(new Date(m.timestamp).getHours())) return false;
        if (selectedUsers.size > 0 && !selectedUsers.has(m.user)) return false;
        if (mediaFilter === 'pics' && (!m.pics || m.pics.length === 0)) return false;
        if (mediaFilter === 'video' && !m.videoUrl && m.content !== '分享视频' && m.content !== 'Video') return false;
        if (mediaFilter === 'link' && !m.link && !m.share && !m.videoUrl) return false;
        if (hideNoise && isNoise(m)) return false;
        if (searchQuery) {
            const c = (m.content || '').toLowerCase();
            const u = (m.user || '').toLowerCase();
            if (!c.includes(searchQuery) && !u.includes(searchQuery)) return false;
        }
        return true;
    });

    const panel = document.getElementById('statsPanel');
    let html = '';
    html += renderDayChart(); // Use date metadata for day chart
    html += renderUserRanking(filtered);
    html += renderHourChart(filtered);
    html += renderMediaBreakdown(allFiltered);
    html += renderWordFrequency(filtered);
    panel.innerHTML = html;
}

function renderDayChart() {
    const days = Object.keys(dateCounts).sort();
    if (days.length === 0) return '';
    const maxCount = Math.max(...Object.values(dateCounts));
    const total = Object.values(dateCounts).reduce((a, b) => a + b, 0);
    const bars = days.map(d => {
        const count = dateCounts[d];
        const height = maxCount > 0 ? Math.max(2, (count / maxCount) * 150) : 2;
        return `<div class="stats-bar-wrap"><div class="stats-bar" style="height:${height}px"><span class="stats-bar-val">${count}</span></div><div class="stats-bar-label">${d.slice(5)}</div></div>`;
    }).join('');
    return `<div class="stats-section"><div class="stats-section-title">Messages Per Day (total: ${total})</div><div class="stats-chart">${bars}</div></div>`;
}

function renderUserRanking(msgs) {
    const counts = {};
    msgs.forEach(m => { counts[m.user] = (counts[m.user] || 0) + 1; });
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 20);
    if (sorted.length === 0) return '';
    const maxCount = sorted[0][1];
    const rows = sorted.map(([user, count], i) => {
        const barWidth = maxCount > 0 ? (count / maxCount) * 100 : 0;
        return `<tr><td class="rank">${i + 1}</td><td>${escapeHtml(user)}</td><td>${count}</td><td class="bar-cell"><div class="mini-bar" style="width:${barWidth}%"></div></td></tr>`;
    }).join('');
    return `<div class="stats-section"><div class="stats-section-title">Top Active Users</div><table class="stats-table"><tr><th>#</th><th>User</th><th>Messages</th><th></th></tr>${rows}</table></div>`;
}

function renderHourChart(msgs) {
    const hourCounts = {};
    msgs.forEach(m => { const h = new Date(m.timestamp).getHours(); hourCounts[h] = (hourCounts[h] || 0) + 1; });
    const maxCount = Math.max(...Object.values(hourCounts), 1);
    const bars = [];
    for (let h = 0; h < 24; h++) {
        const count = hourCounts[h] || 0;
        const height = maxCount > 0 ? Math.max(2, (count / maxCount) * 150) : 2;
        bars.push(`<div class="stats-bar-wrap"><div class="stats-bar" style="height:${height}px"><span class="stats-bar-val">${count}</span></div><div class="stats-bar-label">${String(h).padStart(2, '0')}</div></div>`);
    }
    return `<div class="stats-section"><div class="stats-section-title">Hourly Distribution</div><div class="stats-chart">${bars.join('')}</div></div>`;
}

function renderMediaBreakdown(msgs) {
    let pics = 0, videos = 0, links = 0, shares = 0, plain = 0;
    msgs.forEach(m => {
        const hasPics = m.pics && m.pics.length > 0;
        const hasVideo = !!m.videoUrl;
        const hasShare = !!m.share;
        const hasLink = !hasShare && /https?:\/\//.test(m.content || '');
        if (hasPics) pics++;
        if (hasVideo) videos++;
        if (hasShare) shares++;
        else if (hasLink) links++;
        if (!hasPics && !hasVideo && !hasShare && !hasLink) plain++;
    });
    const cards = [
        { num: msgs.length, label: 'Total' },
        { num: plain, label: 'Text Only' },
        { num: pics, label: 'Photos' },
        { num: videos, label: 'Videos' },
        { num: shares, label: 'Shares' },
        { num: links, label: 'Links' },
    ].map(c => `<div class="stats-media-card"><div class="num">${c.num}</div><div class="label">${c.label}</div></div>`).join('');
    return `<div class="stats-section"><div class="stats-section-title">Media Breakdown</div><div class="stats-media-grid">${cards}</div></div>`;
}

function renderWordFrequency(msgs) {
    const wordCounts = {};
    const STOP_WORDS = new Set(['的','了','是','在','我','有','和','就','不','人','都','一','一个','上','也','很','到','说','要','去','你','会','着','没有','看','好','自己','这','他','她','它','们','那','被','从','把','让','给','对','但','还','而','或','因为','所以','如果','虽然','可以','这个','那个','什么','怎么','吗','吧','呢','啊','哦','嗯','哈','the','a','an','is','are','was','were','be','been','being','have','has','had','do','does','did','will','would','could','should','may','might','can','to','of','in','for','on','with','at','by','from','as','into','through','during','before','after','and','but','or','not','no','so','if','than','too','very','it','its','this','that','i','you','he','she','we','they']);
    msgs.forEach(m => {
        const text = (m.content || '').replace(/https?:\/\/[^\s]+/g, '').replace(/\[[^\]]+\]/g, '').trim();
        const tokens = text.match(/[一-鿿]{2,}|[a-zA-Z]{3,}/g) || [];
        tokens.forEach(w => {
            const lower = w.toLowerCase();
            if (!STOP_WORDS.has(lower) && lower.length >= 2) wordCounts[lower] = (wordCounts[lower] || 0) + 1;
        });
    });
    const sorted = Object.entries(wordCounts).filter(([, c]) => c >= 2).sort((a, b) => b[1] - a[1]).slice(0, 50);
    if (sorted.length === 0) return '';
    const words = sorted.map(([word, count]) => `<span class="stats-word">${escapeHtml(word)} <span class="count">×${count}</span></span>`).join('');
    return `<div class="stats-section"><div class="stats-section-title">Frequent Words</div><div class="stats-word-list">${words}</div></div>`;
}

// Update last visit timestamp
function updateLastVisit() {
    // 仅持久化"本次访问时间"，不改内存变量——
    // 这样整个会话内 NEW 徽章与未读分隔线稳定表示"自上次打开以来"
    localStorage.setItem('lastVisitTimestamp', String(Date.now()));
}

// Update on page unload
window.addEventListener('beforeunload', updateLastVisit);

// Update when switching date
const origSelectDate = selectDate;
selectDate = function(d) {
    updateLastVisit();
    origSelectDate(d);
};

loadData();
loadSchedule();
checkAiConfig();

// Auto-refresh: poll every 60s, reload if new data available
let lastArchivedTs = 0;
async function checkForUpdates() {
    try {
        const groupParam = currentGroup ? '?group=' + encodeURIComponent(currentGroup) : '';
        const resp = await fetch('/api/groups' + groupParam);
        const data = await resp.json();
        if (data.lastArchived && data.lastArchived > lastArchivedTs) {
            lastArchivedTs = data.lastArchived;
            await loadDates();
            await loadMessages(true);
            const dt = new Date(data.lastArchived);
            const timeStr = dt.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('lastArchived').textContent = `🕐 ${timeStr}`;
        }
    } catch {}
}
setInterval(checkForUpdates, 60000);

// ── 实时同步（SSE）────────────────────────────────────────────────
// 服务端 lib/live-sync 轮询 webim 并把新消息并入日文件，这里只负责
// 收到事件后重新拉当天数据 —— 复用 loadMessages 这条已验证的渲染路径，
// 不在前端另写一套消息合并/渲染逻辑（那才是状态不同步 bug 的来源）。
let liveSource = null;
let liveHintedDate = '';   // 跨日提示去重：同一目标日期只提示一次
function setLiveIndicator(state) {
    const el = document.getElementById('liveDot');
    el.classList.toggle('on', state !== 'off');
    el.classList.toggle('stale', state === 'stale');
    el.textContent = state === 'stale' ? '实时(断开)' : '实时';
}
function startLive() {
    if (liveSource) return;
    liveSource = new EventSource('/api/live');
    liveSource.onopen = () => setLiveIndicator('on');
    // EventSource 自带重连；断开期间标灰，重连成功回绿
    liveSource.onerror = () => setLiveIndicator('stale');
    liveSource.onmessage = async (ev) => {
        let event;
        try { event = JSON.parse(ev.data); } catch { return; }
        if (event.type === 'hello') {
            liveGroups = event.groups || [];
            setLiveIndicator(event.enabled && liveGroups.length ? 'on' : 'off');
            updateComposer();
            return;
        }
        if (event.type === 'auth' && event.ok === false) { checkAuthStatus(); return; }
        if (event.type !== 'messages') return;
        // 只有当前正在看的群 + 当天有新消息才刷新，其它群静默入库
        if (event.group !== currentGroup) { checkForUpdates(); return; }
        // 新消息不在当前查看的日期（典型场景：跨过半夜）。不自动切走视图，
        // 但要提示一次，否则会以为实时同步停了。同一目标日期只提示一次。
        if (!event.dates?.includes(selectedDate)) {
            await loadDates();
            const target = event.dates?.[event.dates.length - 1];
            if (target && target !== liveHintedDate) {
                liveHintedDate = target;
                showToast(`新消息已进入 ${target}（当前查看 ${selectedDate}，点日历切换）`, 'success', 6000);
            }
            return;
        }
        await loadMessages(true);
        const dt = new Date();
        const pad = n => String(n).padStart(2, '0');
        document.getElementById('lastArchived').textContent = `⚡ ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
    };
}
function stopLive() {
    if (!liveSource) return;
    liveSource.close();     // 必须真的断开：留着连接服务端就仍算有订阅者
    liveSource = null;
    setLiveIndicator('off');
}

// 实时同步默认关闭：轮询要读群消息，可能影响原生客户端的未读提示，
// 这个代价由用户显式选择承担。开关状态存在服务端（浏览器版与桌面版共享）。
async function loadLiveConfig() {
    try {
        const c = await (await fetch('/api/live-config')).json();
        document.getElementById('liveSelect').value = c.enabled ? '1' : '0';
        liveGroups = c.groups || [];
        if (c.enabled) startLive(); else { stopLive(); updateComposer(); }
    } catch { /* 服务端不可达时保持现状 */ }
}
async function updateLiveConfig(val) {
    const enabled = val === '1';
    try {
        const r = await (await fetch('/api/live-config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled }),
        })).json();
        if (!r.ok) { showToast('设置失败：' + (r.error || '未知错误'), 'error'); loadLiveConfig(); return; }
        if (enabled) { startLive(); showToast('实时同步已开启（每 20 秒读取一次新消息）', 'success', 4000); }
        else { stopLive(); showToast('实时同步已关闭，查看器不再主动查询微博', 'success', 4000); }
    } catch (e) {
        showToast('设置失败：' + e.message, 'error');
        loadLiveConfig();
    }
}
loadLiveConfig();

// ── 聊天：发送到当前群 ────────────────────────────────────────────
// 只在该群有可用会话 id（归档器记录过 groupId）时才显示输入框 ——
// 否则点了也只能报错。发出去的消息不在本地伪造回显：实时同步下一轮会把它
// 按与他人消息相同的路径拉回，避免两条来源打架。
let liveGroups = [];
function updateComposer() {
    const canSend = liveGroups.includes(currentGroup);
    document.getElementById('composer').classList.toggle('on', canSend && !statsView);
    const hint = document.getElementById('composerHint');
    const needArchive = !canSend && !statsView && liveGroups.length >= 0 && currentGroup;
    hint.classList.toggle('on', needArchive);
    if (needArchive) hint.textContent = `「${currentGroup}」暂不可发送：先点「同步」跑一次归档，记录群会话 id 后即可实时收发`;
}
function autoGrowComposer(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function composerKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {   // 中文输入法组字中的 Enter 不算发送
        e.preventDefault();
        sendChatMessage();
    }
}
async function sendChatMessage() {
    const input = document.getElementById('composerInput');
    const btn = document.getElementById('composerSend');
    const content = input.value.trim();
    if (!content) return;
    input.disabled = btn.disabled = true;
    try {
        const r = await (await fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ group: currentGroup, content }),
        })).json();
        if (r.ok) {
            input.value = '';
            autoGrowComposer(input);
            showToast('✓ 已发送', 'success', 2000);
        } else {
            // 失败时保留输入内容，方便重发
            showToast('发送失败：' + (r.error || '未知错误'), 'error', 6000);
            if (r.needLogin) { checkAuthStatus(); doLogin(); }
        }
    } catch (e) {
        showToast('发送出错：' + e.message, 'error', 6000);
    } finally {
        input.disabled = btn.disabled = false;
        input.focus();
    }
}
</script>
